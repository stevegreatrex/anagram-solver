name: Test Static Site Build

# This workflow tests that the static site files are valid
# and can be deployed successfully

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-static-files:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Validate static files
        run: |
          echo "🔍 Validating essential static files..."
          
          # Check that all essential files exist
          for file in index.html sw.js words.js manifest.json robots.txt \
            icons/icon-192.png icons/icon-512.png \
            icons/maskable-192.png icons/maskable-512.png \
            icons/apple-touch-icon.png icons/favicon-32.png; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file ($(wc -c < "$file") bytes)"
          done
          
          # Validate JSON files
          echo "📋 Validating JSON syntax..."
          python3 -c "
          import json
          with open('manifest.json', 'r') as f:
              manifest = json.load(f)
          print('✅ manifest.json is valid JSON')
          print(f'   App: {manifest[\"name\"]}')
          assert manifest['display'] == 'standalone'
          assert manifest['start_url'] == '/'
          assert manifest['scope'] == '/'
          assert manifest.get('prefer_related_applications') is False
          assert all(not icon['src'].startswith('data:') for icon in manifest['icons'])
          icon_sizes = {(icon['sizes'], icon.get('purpose', 'any')) for icon in manifest['icons']}
          assert ('192x192', 'any') in icon_sizes
          assert ('512x512', 'any') in icon_sizes
          assert ('192x192', 'maskable') in icon_sizes
          assert ('512x512', 'maskable') in icon_sizes
          "

          # Verify the declared raster dimensions from each PNG IHDR chunk.
          python3 - <<'PY'
          import struct

          expected = {
              'icons/icon-192.png': (192, 192),
              'icons/icon-512.png': (512, 512),
              'icons/maskable-192.png': (192, 192),
              'icons/maskable-512.png': (512, 512),
              'icons/apple-touch-icon.png': (180, 180),
              'icons/favicon-32.png': (32, 32),
          }
          for path, dimensions in expected.items():
              with open(path, 'rb') as image:
                  assert image.read(8) == b'\x89PNG\r\n\x1a\n'
                  image.read(8)
                  actual = struct.unpack('>II', image.read(8))
              assert actual == dimensions, f'{path}: expected {dimensions}, got {actual}'
          print('✅ PWA icon dimensions are valid')
          PY

      - name: Test static site serving
        run: |
          echo "🌐 Testing static site serving..."
          
          # Start a simple HTTP server in background
          python3 -m http.server 8000 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 3
          
          # Test that the site loads
          if curl -f -s http://localhost:8000/ > /dev/null; then
            echo "✅ Static site serves correctly"
          else
            echo "❌ Failed to serve static site"
            kill $SERVER_PID
            exit 1
          fi
          
          # Test PWA manifest
          if curl -f -s http://localhost:8000/manifest.json > /dev/null; then
            echo "✅ PWA manifest serves correctly"
          else
            echo "❌ Failed to serve PWA manifest"
            kill $SERVER_PID
            exit 1
          fi
          
          # Test service worker
          if curl -f -s http://localhost:8000/sw.js > /dev/null; then
            echo "✅ Service worker serves correctly"
          else
            echo "❌ Failed to serve service worker"
            kill $SERVER_PID
            exit 1
          fi
          
          # Clean up
          kill $SERVER_PID
          echo "🎉 All tests passed!"
